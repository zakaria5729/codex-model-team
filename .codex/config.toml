# Project-local defaults for the Codex Model Team repository.
# The installer preserves existing target-project settings instead of overwriting them.
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

[agents]
max_concurrent_threads_per_session = 4

[plugins."codex-model-team@codex-model-team"]
enabled = true
